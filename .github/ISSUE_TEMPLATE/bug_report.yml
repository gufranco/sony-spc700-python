name: Something is wrong
description: An instruction does the wrong thing, spends the wrong number of cycles, or nothing works at all
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A report about this core is almost always settled by one of two runs: the
        suite, which says whether the case is already covered, or a single
        stepped instruction with its bus log, which says exactly where the two
        part company. The fields below ask for whichever applies.

  - type: dropdown
    id: kind
    attributes:
      label: What kind of disagreement
      options:
        - The final state is wrong
        - The final state is right and the cycles are wrong
        - It raises, or hangs
        - Something else
    validations:
      required: true

  - type: textarea
    id: opcode
    attributes:
      label: The instruction, and the state it ran in
      description: |
        The opcode bytes and the registers before it. Enough for somebody to set
        the same state up and step it once.
      render: text
      placeholder: |
        DA 10        MOVW $10, YA
        before: A=12 X=00 Y=34 SP=EF PSW=00, and $0010 holds 99
    validations:
      required: true

  - type: textarea
    id: happened
    attributes:
      label: What this core does, and what you expected
      description: |
        For a cycle disagreement, paste both bus logs. Each line is a kind, an
        address, and a value where one is asserted, in cycle order.
      render: text
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: What says otherwise
      description: |
        A page of the development manual, a suite case, or a measurement off a
        real part. Naming the page beats quoting a number: the manual is already
        known to be wrong in one place, and that one is recorded.
      placeholder: |
        Appendix C table C-11, and the suite case DA.json case 3
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: The shortest thing that shows it
      description: Python we can run as it stands, with no editing.
      render: python
      placeholder: |
        from spc700 import Cpu, SparseMemory

        cpu = Cpu(SparseMemory())
        cpu.step()

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: The output above is complete rather than trimmed
          required: true
        - label: I have attached no firmware and no part of one
          required: true
