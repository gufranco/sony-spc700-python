---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pipx install ruff==0.16.3

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install the formatter
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check that every file Prettier reads is formatted
        run: pnpm run format:check

      - name: Lint every YAML file
        run: |
          pipx install yamllint==1.38.0
          yamllint --strict .

  types:
    name: Types
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the type checker and the build backend's stubs
        run: |
          pipx install mypy==1.14.1
          pipx inject mypy types-setuptools==84.0.0.20260812

      - name: Check types, strictly, as configured in pyproject.toml
        run: mypy

  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install coverage and the build backend its tests drive
        run: |
          python -m pip install --disable-pip-version-check \
            coverage==7.6.10 setuptools==84.0.0

      - name: Run every test file, under coverage
        run: |
          python -m coverage erase
          status=0
          while IFS= read -r file; do
            echo "::group::${file}"
            python -m coverage run -a "${file}" || status=1
            echo "::endgroup::"
          done < <(find spc700 conformance -name '*.test.py' | sort)
          exit "${status}"
        shell: bash

      - name: Coverage must be total
        run: python -m coverage report

  speed:
    name: Throughput
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: The core must still run faster than the floor
        run: python -m conformance.speed

  quotes:
    name: Every quoted sentence, against the document it came from
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Every quote against the manual, which says so when it is absent
        run: python -m conformance.quotes

  conformance:
    name: Conformance against SingleStepTests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Read the pinned suite commit
        id: pin
        run: |
          commit=$(python - <<'PY'
          import json
          import pathlib
          suites = json.loads(pathlib.Path("conformance/suites.json").read_text())
          print(suites["suites"][0]["commit"])
          PY
          )
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"

      - name: Cache the suite
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/conformance-suites
          key: suites-${{ steps.pin.outputs.commit }}

      - name: Fetch the suite
        if: steps.cache.outputs.cache-hit != 'true'
        run: python -m conformance.fetch ~/.cache/conformance-suites

      - name: Run the suite through both runners, a tenth of each file on a pull request
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            limit=100
          else
            limit=0
          fi
          python -m conformance.singlestep \
            ~/.cache/conformance-suites/spc700/spc700/v1 "${limit}"
          python -m conformance.cycles \
            ~/.cache/conformance-suites/spc700/spc700/v1 "${limit}"
        shell: bash

  package:
    name: package
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Every module ships and no test does
        run: python -m conformance.package dist/spc700-*.whl
